<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>队伍报告 · 无畏契约 2026</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --bg:#EAE7E0; --panel:#FFFFFF; --panel2:#F5F2EC; --panel3:#E9E5DC;
    --line:#DBD5C9; --line2:#C3BDAF;
    --fg:#1B1A17; --dim:#6B6862; --dim2:#9B968C;
    --red:#DE3B49; --cyan:#0E7C74; --gold:#A5741C;
    --green:#157F3B; --amber:#B45309;
    --sans:'Inter','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',system-ui,sans-serif;
    --mono:'JetBrains Mono','Cascadia Mono',Consolas,ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--sans); font-size:13px; line-height:1.55; letter-spacing:.004em;
  }
  a{color:var(--cyan); text-decoration:none}
  a:hover{text-decoration:underline}
  header{
    padding:16px 26px 13px; border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end;
    justify-content:space-between; position:sticky; top:0; z-index:20;
    background:#FFFFFF;
  }
  h1{margin:0; font-size:19px; font-weight:600; letter-spacing:-.01em}
  h1 span{color:var(--red); font-weight:400}
  .sub{color:var(--dim2); font-size:12px; margin-top:3px}
  .navbtn{
    background:none; border:0; border-bottom:1px solid var(--line2); color:var(--dim);
    padding:2px 0; border-radius:0; font-size:12px; font-family:inherit;
    cursor:pointer; transition:.12s;
  }
  .navbtn:hover{color:var(--fg); border-bottom-color:var(--fg)}

  /* 顶部三个页签，与总览页一致 */
  .tabs{display:flex; gap:2px; align-items:flex-end}
  .tab{
    display:inline-block; padding:7px 14px 8px; font-size:13px;
    color:var(--dim); text-decoration:none; border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .tab:hover{color:var(--fg)}
  /* 选中态用墨黑不用红：红只留给数据 */
  .tab.on{color:var(--fg); border-bottom-color:var(--fg); font-weight:600}

  main{padding:18px 26px 60px; max-width:1560px; margin:0 auto}

  /* controls */
  .controls{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:14px 16px; margin-bottom:16px;
    display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;
  }
  .ctl{display:flex; flex-direction:column; gap:5px; min-width:0}
  .ctl label{font-size:10px; letter-spacing:1px; color:var(--dim); text-transform:uppercase}
  select{
    background:var(--panel2); border:1px solid var(--line); color:var(--fg);
    padding:8px 10px; border-radius:6px; font-size:13px; font-family:inherit;
    min-width:190px; cursor:pointer;
  }
  select:focus{outline:none; border-color:var(--cyan)}
  .scope{margin-left:auto; text-align:right; font-size:12px; color:var(--dim)}
  .scope b{color:var(--cyan); font-weight:500}

  /* report head */
  .rhead{
    display:flex; flex-wrap:wrap; gap:20px; align-items:center;
    padding:16px 20px; margin-bottom:16px; border-radius:6px;
    background:#FFFFFF;
    border:1px solid var(--line);
  }
  .teamwrap{display:flex; align-items:center; gap:13px; min-width:0}
  .rlogo{width:46px; height:46px; object-fit:contain; flex:0 0 auto; box-sizing:border-box;
         filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}
  .rlogo[hidden]{display:none}
  .rlogo.plt{background:transparent; padding:0}
  .rlogo.pltl{background:#2A2925; border-radius:6px; padding:6px}
  .rhead .team{font-size:19px; font-weight:600; letter-spacing:.5px}
  .ttag{display:inline-block; vertical-align:6px; margin-left:9px; font-size:10px;
        line-height:16px; padding:0 5px; color:var(--dim);
        border:1px solid var(--line); border-radius:2px; letter-spacing:.6px}
  .rhead .meta{font-size:12px; color:var(--dim); margin-top:2px}
  .badges{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto}
  /* 徽章只在真的缺数据时才出现，平时不占位 */
  .badge{
    font-size:12px; padding:2px 0; border-radius:0;
    background:none; border:0; border-bottom:1px solid var(--line); color:var(--dim);
  }
  .badge.warn{border-bottom-color:var(--amber); color:var(--amber)}

  /* verdict */
  .verdict{
    border:1px solid rgba(222,59,73,.22); border-radius:6px;
    background:#FDF3F4; padding:16px 18px; margin-bottom:16px;
  }
  .verdict h2{
    margin:0 0 12px; font-size:12px; letter-spacing:1.6px; color:var(--red);
    text-transform:uppercase; font-weight:600;
  }
  .vitem{display:grid; grid-template-columns:74px minmax(0,1fr);
         gap:11px; align-items:baseline; padding:7px 0;
         border-top:1px solid rgba(27,26,23,.07)}
  .vitem:first-of-type{border-top:none; padding-top:2px}
  .vtag{font-size:10px; color:var(--dim); border:1px solid var(--line);
        border-radius:2px; padding:0 5px; white-space:nowrap; justify-self:start}
  .vbody{display:flex; gap:13px; align-items:baseline; min-width:0; flex-wrap:wrap}
  .vmain{font-size:13px}
  .vbody{flex:1; min-width:0}
  .vcmp{font-family:var(--mono); font-size:12px; color:var(--dim2);
        white-space:nowrap; font-variant-numeric:tabular-nums}
  .vnone{color:var(--dim); font-size:13px}

  /* grid */
  .grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
  .full{grid-column:1 / -1}
  @media (max-width:1100px){ .grid{grid-template-columns:minmax(0,1fr)} }
  /* 窄屏：宽表会把 panel 撑破，让面板自己横向滚，别把整页推出去 */
  @media (max-width:760px){
    .panel{min-width:0; overflow-x:auto}
    .vitem{grid-template-columns:70px minmax(0,1fr); gap:9px}
    .vmain{font-size:13px}
  }

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 16px}
  .panel h3{
    margin:0 0 3px; font-size:13px; letter-spacing:.6px; font-weight:500;
  }
  .panel .note{font-size:12px; color:var(--dim); margin-bottom:12px}

  /* kpi */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px}
  .kpi{background:var(--panel2); border-radius:6px; padding:10px 12px}
  .kpi b{display:block; font-size:19px; color:var(--cyan); font-weight:500; line-height:1.25}
  .kpi b.dim2{color:var(--dim)}
  .kpi i{font-style:normal; font-size:10px; color:var(--dim); letter-spacing:.4px}

  /* 术语小问号：点开就地显示解释，不另开版面 */
  .kpi{position:relative}
  .termq{cursor:pointer; border-bottom:1px dotted var(--dim); white-space:nowrap}
  .termq i{font-style:normal; font-size:10px; vertical-align:super;
           color:var(--dim); margin-left:1px; opacity:.75}
  .termq.open{border-bottom-color:var(--red)}
  .termtip{
    display:none; position:absolute; left:8px; right:8px; top:100%;
    margin-top:6px; z-index:40; background:var(--panel); color:var(--fg);
    border:1px solid var(--line2); border-radius:6px; padding:9px 11px;
    font-size:12px; line-height:1.6; font-style:normal; text-align:left;
  }
  .termq.open + .termtip{display:block}
  .kpi .cmp{font-size:10px; color:var(--dim); margin-top:2px}
  .cmp .up{color:var(--green)}
  .cmp .dn{color:var(--red)}

  /* bars */
  .bar{margin-bottom:9px}
  .bar .lab{display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px; gap:10px}
  .bar .lab span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bar .lab span:last-child{color:var(--dim); flex:0 0 auto; font-variant-numeric:tabular-nums; font-size:12px; white-space:nowrap}
  .fill{height:100%; background:var(--red); border-radius:4px}
  .fill.cyan{background:var(--cyan)}
  .fill.gold{background:var(--gold)}

  /* comp timeline */
  .clegend{display:flex; flex-direction:column; gap:4px; margin-bottom:13px}
  .clegend .ci{display:flex; align-items:baseline; gap:7px; font-size:12px; line-height:1.4}
  .csw{width:9px; height:9px; border-radius:2px; flex:0 0 auto; transform:translateY(-1px)}
  .cname{flex:1; min-width:0; color:var(--fg)}
  .cnum{font-family:var(--mono); font-size:10px; color:var(--dim); white-space:nowrap;
        font-variant-numeric:tabular-nums}
  .tlrow{display:flex; align-items:center; gap:10px; margin-bottom:6px}
  .tlrow .k{flex:0 0 150px; font-size:12px; color:var(--dim); white-space:nowrap;
            overflow:hidden; text-overflow:ellipsis}
  .tlbar{flex:1; min-width:0; height:16px; display:flex; border-radius:2px; overflow:hidden;
         background:rgba(27,26,23,.06)}
  .tlbar.nodata{background:repeating-linear-gradient(45deg,rgba(27,26,23,.05) 0 4px,transparent 4px 8px)}
  .tlbar i{height:100%; display:block}
  .tlrow .v{flex:0 0 auto; min-width:84px; text-align:right; font-family:var(--mono);
            font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums}
  .tlrow .v b{font-weight:500; color:var(--fg)}
  .tlrow .v.mute b{color:var(--dim2)}

  /* table */
  table{width:100%; border-collapse:collapse; font-size:13px}
  th{
    text-align:right; padding:6px 8px; color:var(--dim); font-weight:400;
    font-size:10px; letter-spacing:.5px; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  th:first-child{text-align:left}
  td{padding:6px 8px; text-align:right; border-bottom:1px solid rgba(42,53,64,.45);
     font-variant-numeric:tabular-nums}
  td:first-child{text-align:left; font-variant-numeric:normal}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  .small{font-size:10px; color:var(--dim)}

  /* histogram */
  .hist{display:flex; align-items:flex-end; gap:6px; height:96px; margin:8px 0 4px}
  .hbar{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px}
  .hbar .b{width:100%; background:var(--cyan); border-radius:2px 3px 0 0; min-height:2px}
  .hbar .t{font-size:10px; color:var(--dim)}
  .hist-x{display:flex; gap:6px}
  .hist-x div{flex:1; text-align:center; font-size:10px; color:var(--dim)}

  .legend{display:flex; gap:14px; font-size:12px; color:var(--dim); margin-top:8px; flex-wrap:wrap}
  .legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px}

  footer{padding:20px 26px 40px; color:var(--dim); font-size:12px; border-top:1px solid var(--line); margin-top:20px}

  @media print{
    body{background:#fff; color:#111}
    header,.controls,.navbtn{display:none}
    .panel,.rhead,.verdict{background:#fff; border-color:#ccc; break-inside:avoid}
    .kpi{background:#f4f4f4}
    .kpi b{color:#0b6b7a}
  }
  /* ---------- design pass v2：与主站同一套视觉语言 ---------- */
  /* 数字全部等宽，读数时列不会抖 */
  .kpi b, td.num, .num, .cmp{
    font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.015em;
  }
  .kpi b{color:var(--fg); font-weight:600; font-size:19px}
  .kpi{background:#F8F5EF; border:1px solid var(--line); border-radius:4px}
  .panel{border-radius:6px; border-color:var(--line)}
  .panel h3{
    display:flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:.01em; color:var(--fg); font-weight:600;
  }
  .panel h3 .note{display:inline}
  .verdict{border-radius:6px; border-color:var(--line)}
  .note{color:var(--dim2)}
  .badge{border-radius:4px; border-color:var(--line2); font-size:10px}
  table th{font-size:10px; letter-spacing:.13em; color:var(--dim2)}
  table td{border-bottom:1px solid rgba(31,45,56,.75)}
  tbody tr:hover{background:rgba(255,255,255,.028)}
  .ctl select{
    background:transparent; border:1px solid var(--line2); border-radius:4px;
    color:var(--fg); font-size:12px; padding:6px 10px;
  }
  .ctl label{font-size:10px; letter-spacing:.14em; color:var(--dim2); text-transform:uppercase}
  .verdict h2{font-size:12px; letter-spacing:.02em}
  .vitem{border-radius:4px}
  .toast{position:fixed; left:50%; bottom:28px; transform:translate(-50%, 10px);
    background:var(--fg); color:#fff; padding:9px 16px; border-radius:6px;
    font-size:12px; opacity:0; pointer-events:none; z-index:300;
    transition:opacity .18s, transform .18s}
  .toast.show{opacity:1; transform:translate(-50%, 0)}
</style>
</head>
<body>

<header>
  <div>
    <h1>队伍报告 <span>/</span> 无畏契约 2026</h1>
    <div class="sub">赛前对手准备 · 基于 vlr.gg 2D 回放的回合级数据</div>
  </div>
  <nav class="tabs" role="tablist">
    <a class="tab" href="index.html" role="tab" aria-selected="false">总览</a>
    <a class="tab on" href="scout.html" role="tab" aria-selected="true">队伍简报</a>
    <a class="tab" href="duel.html" role="tab" aria-selected="false">选手对比</a>
  </nav>
</header>

<main>
  <div class="controls">
    <div class="ctl">
      <label>目标队伍</label>
      <select id="teamSel"></select>
    </div>
    <div class="ctl">
      <label>地图</label>
      <select id="mapSel"></select>
    </div>
    <div class="ctl">
      <label>赛事</label>
      <select id="evSel"></select>
    </div>
    <div style="display:flex;gap:8px;margin-left:auto">
      <button class="navbtn" id="shareBtn">复制链接</button>
      <button class="navbtn" onclick="window.print()">导出 PDF</button>
    </div>
    <div class="scope" id="scopeInfo"></div>
  </div>

  <div class="rhead">
    <div class="teamwrap">
      <img class="rlogo" id="teamLogo" alt="" hidden>
      <div>
        <div class="team" id="teamName">—</div>
        <div class="meta" id="teamMeta"></div>
      </div>
    </div>
    <div class="badges" id="teamBadges"></div>
  </div>

  <div class="verdict">
    <h2 id="verdictTitle">与当前范围的平均对比</h2>
    <div id="verdictBody"></div>
  </div>

  <div class="grid">
    <div class="panel full">
      <h3>核心指标</h3>
      <div class="kpis" id="kpis"></div>
    </div>

    <div class="panel">
      <h3 id="compTitle">阵容 · 按赛事</h3>
      <div class="note" id="compNote"></div>
      <div id="compLegend" class="clegend"></div>
      <div id="compList"></div>
    </div>

    <div class="panel">
      <h3>手枪局</h3>
      <div class="note" id="pistolNote"></div>
      <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(96px,1fr))" id="pistolKpis"></div>
    </div>

    <div class="panel">
      <h3>攻防分侧</h3>
      <table>
        <thead><tr><th>位置</th><th>回合</th><th>胜率</th><th>首杀率</th><th>首杀→胜</th></tr></thead>
        <tbody id="sideRows"></tbody>
      </table>
    </div>

    <div class="panel full">
      <h3>谁在开火</h3>
      <table>
        <thead><tr>
          <th>选手</th><th>首杀</th><th>占队内</th><th>每 10 回合</th>
          <th>主用英雄</th>
        </tr></thead>
        <tbody id="playerRows"></tbody>
      </table>
    </div>

    <div class="panel">
      <h3>首杀时刻</h3>
      <div class="note" id="timeNote"></div>
      <div class="hist" id="timeHist"></div>
      <div class="hist-x" id="timeHistX"></div>
    </div>

    <div class="panel">
      <h3>首杀后能不能赢</h3>
      <div id="tradeBlock"></div>
    </div>
  </div>

  <footer id="footNote"></footer>
</main>

<script>
const S = { raw:null, D:null, Z:null, M:null, players:null, base:null };
const F = { team:0, map:-1, ev:-1 };
let view = [];

const pct = (a,b) => b ? (100*a/b).toFixed(1) : '—';
const fmt = n => n.toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const median = arr => {
  if(!arr.length) return null;
  const s = arr.slice().sort((x,y)=>x-y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1]+s[m])/2;
};

/* ---------------------------------------------------------------- */
/* helpers: flatten a round row for one team                        */
/* ---------------------------------------------------------------- */
function sideOf(r, t){
  const isAtk = (r[2] === t);
  return {
    mine:  isAtk ? r[14] : r[15],
    their: isAtk ? r[15] : r[14],
    myEcon:  isAtk ? r[16] : r[17],
    theirEcon: isAtk ? r[17] : r[16],
    isAtk
  };
}
function myCompOf(r, t){
  return (r[5] === t) ? r[12] : r[13];
}

/* pistol rounds + what the team does on round 2 after losing one */
function pistolStats(rows, t){
  const pist = rows.filter(r => r[18] === 1 || r[18] === 13);
  const st = {
    n: pist.length,
    won: pist.filter(r => r[4] === t).length,
    atkN: pist.filter(r => r[2] === t).length,
    atkWon: pist.filter(r => r[2] === t && r[4] === t).length,
    defN: pist.filter(r => r[3] === t).length,
    defWon: pist.filter(r => r[3] === t && r[4] === t).length,
    r2N: 0, r2Save: 0, r2Spend: []
  };
  const byG = new Map();
  for(const r of rows){
    if(!byG.has(r[20])) byG.set(r[20], []);
    byG.get(r[20]).push(r);
  }
  for(const rs of byG.values()){
    const pm = new Map();
    for(const r of rs) if(r[18] === 1 || r[18] === 13) pm.set(r[18], r);
    for(const [pno, rno2] of [[1,2],[13,14]]){
      const p = pm.get(pno);
      if(!p || p[4] === t) continue;
      const r2 = rs.find(x => x[18] === rno2);
      if(!r2) continue;
      const sp = (r2[2] === t) ? r2[14] : r2[15];
      if(sp < 0) continue;
      st.r2N++; st.r2Spend.push(sp);
      if(sp < 3000) st.r2Save++;
    }
  }
  return st;
}

/* ---------------------------------------------------------------- */
/* league baselines                                                 */
/* ---------------------------------------------------------------- */
/* 基准必须和筛选范围一致。
   原来永远拿全样本当基准：切到「日落之城」时，PRX 的日落数据还在跟
   所有地图的平均比——那是错的对比。

   现在按当前 赛事/地图 重算基准（不含队伍筛选，因为要比的就是「这支队 vs
   同一范围内所有队」）。scopeKey 用来判断要不要重算，避免每次换队都重跑一遍。 */
function buildBaselines(ev, map){
  ev = (ev == null) ? -1 : ev;
  map = (map == null) ? -1 : map;
  const R = S.raw.rounds.filter(r =>
    (ev < 0 || r[0] === ev) && (map < 0 || r[1] === map));
  const b = {n: 0, ev, map};

  let n = 0, atkWin = 0, fbConv = 0, fbN = 0, tradedN = 0, tradedWon = 0, untradedN = 0, untradedWon = 0;
  const econ = { 0:[0,0], 1:[0,0], 2:[0,0] };

  for(const r of R){
    n++;
    if(r[4] === r[2]) atkWin++;
    if(r[5] >= 0){
      fbN++;
      if(r[4] === r[5]) fbConv++;
      if(r[11] === 1){ tradedN++; if(r[4] === r[5]) tradedWon++; }
      else if(r[11] === 0){ untradedN++; if(r[4] === r[5]) untradedWon++; }
    }
    for(const [t, e] of [[r[2], r[16]], [r[3], r[17]]]){
      if(e < 0) continue;
      econ[e][0]++;
      if(r[4] === t) econ[e][1]++;
    }
  }
  b.n = n;
  if(!n) return b;
  b.atkWin = 100*atkWin/n;
  b.fbConv = fbN ? 100*fbConv/fbN : null;
  b.tradePct = fbN ? 100*tradedN/fbN : null;
  b.tradedWin = tradedN ? 100*tradedWon/tradedN : null;
  b.untradedWin = untradedN ? 100*untradedWon/untradedN : null;
  b.tradeGap = (b.tradedWin != null && b.untradedWin != null)
    ? b.untradedWin - b.tradedWin : null;
  b.econShare = {}; b.econWin = {};
  for(const k of [0,1,2]){
    b.econWin[k] = econ[k][0] ? 100*econ[k][1]/econ[k][0] : null;
    b.econShare[k] = 100*econ[k][0]/(econ[0][0]+econ[1][0]+econ[2][0]);
  }

  // pistol rounds + round-2 buy after losing the pistol
  const games = new Map();
  for(const r of R){
    if(!games.has(r[20])) games.set(r[20], []);
    games.get(r[20]).push(r);
  }
  let pN = 0, pAtkWin = 0, r2N = 0, r2Force = 0, r2Save = 0, r2Sum = 0;
  for(const rs of games.values()){
    const pist = new Map();
    for(const r of rs) if(r[18] === 1 || r[18] === 13) pist.set(r[18], r);
    for(const r of pist.values()){
      pN++;
      if(r[4] === r[2]) pAtkWin++;
    }
    for(const [pno, rno2] of [[1,2],[13,14]]){
      const p = pist.get(pno);
      if(!p) continue;
      const r2 = rs.find(x => x[18] === rno2);
      if(!r2) continue;
      for(const t of [p[2], p[3]]){
        if(p[4] === t) continue;
        const sp = (r2[2] === t) ? r2[14] : r2[15];
        if(sp < 0) continue;
        r2N++; r2Sum += sp;
        if(sp >= 13000) r2Force++;
        if(sp < 3000) r2Save++;
      }
    }
  }
  b.pistolN = pN;
  b.pistolAtkWin = pN ? 100*pAtkWin/pN : null;
  b.r2N = r2N;
  b.r2Force = r2N ? 100*r2Force/r2N : null;
  b.r2Save = r2N ? 100*r2Save/r2N : null;
  b.r2Avg = r2N ? r2Sum/r2N : null;
  b.games = games;

  // first-blood concentration per team (top player share)
  b.conc = new Map();
  const tmp = new Map();
  for(const r of R){
    if(r[5] < 0 || r[19] < 0) continue;
    if(!tmp.has(r[5])) tmp.set(r[5], new Map());
    const m = tmp.get(r[5]);
    m.set(r[19], (m.get(r[19])||0)+1);
  }
  let cSum = 0, cN = 0;
  const cShares = [];
  for(const [t, m] of tmp){
    const tot = [...m.values()].reduce((a,b)=>a+b,0);
    const top = Math.max(...m.values());
    const share = tot ? 100*top/tot : 0;
    b.conc.set(t, {tot, top, share, players: m.size,
                   pid: [...m.entries()].sort((a,b)=>b[1]-a[1])[0][0]});
    if(tot >= 80){ cSum += share; cN++; cShares.push(share); }
  }
  b.concAvg = cN ? cSum/cN : null;
  b.concMed = cShares.length ? median(cShares) : null;

  // 同一范围内的首杀中位时刻（倾向面板要拿它当基准）
  const secAll = [];
  for(const r of R) if(r[5] >= 0 && r[8] >= 0) secAll.push(r[8]);
  b.secMed = secAll.length ? median(secAll) : null;

  /* 基准口径：回合加权平均。
     即把该范围内所有回合放在一起算一个率——回合多的队伍自然权重大。
     这是「真正的平均」：一个回合算一次，不因为属于哪支队而改变权重。
     （另一种算法是「队伍等权」，先算每队各自的率再对队伍取平均。
       两者在本赛季差约 1.2pp，差异全部来自赛程不平衡：PRX 2,396 回合
       而 ONSIDE 只有 234 回合。回合加权不给小样本队伍同等的发言权。） */
  b.weighting = '回合加权';
  b.scopeLabel = (ev < 0 ? '全部赛事' : S.Z.events[S.D.events[ev]])
    + ' · ' + (map < 0 ? '全部地图' : S.Z.maps[S.D.maps[map]]);

  return b;
}

/* ---------------------------------------------------------------- */
/* scope aggregation                                                */
/* ---------------------------------------------------------------- */
function aggregate(rows, t){
  const a = {
    n:0, won:0, fbFor:0, fbAgainst:0, fbWon:0,
    traded:0, untraded:0, tradedWon:0, untradedWon:0,
    atk:{n:0,won:0,fbFor:0,fbWon:0}, def:{n:0,won:0,fbFor:0,fbWon:0},
    comps:new Map(), compN:0, metaHit:0, metaN:0,
    econ:{0:[0,0],1:[0,0],2:[0,0]},
    players:new Map(), agents:new Map(),
    secs:[], xs:[], ys:[]
  };
  for(const r of rows){
    const s = sideOf(r, t);
    const won = (r[4] === t);
    const fbFor = (r[5] === t);
    const sd = s.isAtk ? a.atk : a.def;
    a.n++; if(won) a.won++;
    sd.n++; if(won) sd.won++;
    if(fbFor){ a.fbFor++; sd.fbFor++; if(won){ a.fbWon++; sd.fbWon++; } }
    else if(r[5] >= 0) a.fbAgainst++;

    if(fbFor){
      if(r[11] === 1){ a.traded++; if(won) a.tradedWon++; }
      else if(r[11] === 0){ a.untraded++; if(won) a.untradedWon++; }
    }

    const mc = myCompOf(r, t);
    if(mc >= 0){
      a.comps.set(mc, (a.comps.get(mc)||0)+1);
      a.compN++;
      const top = S.raw.metaTop[String(r[1])];
      if(top){
        const set = new Set(top);
        let hit = 0;
        for(const ag of S.raw.comps[mc]) if(set.has(ag)) hit++;
        a.metaHit += hit/5; a.metaN++;
      }
    }

    if(s.myEcon >= 0){
      a.econ[s.myEcon][0]++;
      if(won) a.econ[s.myEcon][1]++;
    }

    if(fbFor && r[19] >= 0){
      let p = a.players.get(r[19]);
      if(!p){ p = {n:0, won:0, agents:new Map()}; a.players.set(r[19], p); }
      p.n++; if(won) p.won++;
      p.agents.set(r[6], (p.agents.get(r[6])||0)+1);
      a.agents.set(r[6], (a.agents.get(r[6])||0)+1);
    }
    if(fbFor && r[8] >= 0) a.secs.push(r[8]);
  }
  return a;
}

/* ---------------------------------------------------------------- */
/* insight engine                                                   */
/* ---------------------------------------------------------------- */
function insights(a, b, t, ps){
  const out = [];
  const pp  = d => (d >= 0 ? '+' : '') + d.toFixed(1) + 'pp';
  const push = (sev, tag, main, cmp, key) =>
    out.push({sev: Math.abs(sev), tag, main, cmp, key: key || tag});
  /* 基准标签跟着筛选走。写「回合加权」是为了不让人误解——同一个范围里
     也可以用「队伍等权」算（每队先各自出一个率再平均），两者不等。
     我们统一用回合加权：一个回合算一次，不打折。 */
  const BL = (b.scopeLabel || '全部赛事 · 全部地图');

  const fbRate  = a.n ? 100*a.fbFor/a.n : null;
  const fbConv  = a.fbFor ? 100*a.fbWon/a.fbFor : null;
  const tradePct= (a.traded + a.untraded) ? 100*a.traded/(a.traded+a.untraded) : null;
  const defWin  = a.def.n ? 100*a.def.won/a.def.n : null;
  const atkWin  = a.atk.n ? 100*a.atk.won/a.atk.n : null;
  const baseDef = b.atkWin != null ? 100 - b.atkWin : null;
  const fullWin = a.econ[2][0] ? 100*a.econ[2][1]/a.econ[2][0] : null;
  const ecoWin  = a.econ[0][0] ? 100*a.econ[0][1]/a.econ[0][0] : null;
  const conc    = b.conc.get(t);
  const secMed  = median(a.secs);

  /* 全部候选都列出来，不设阈值门槛。
     页面存在的意义是让读者看到差距，不是替他判断哪个差距「够大」——
     阈值只会把差异藏起来。每条后面都带基准值和差额，大小自己看。 */

  if(fbConv != null && b.fbConv != null){
    const d = fbConv - b.fbConv;
    push(d*2.2, '首杀转化',
      `拿了首杀后赢下 ${fbConv.toFixed(1)}% 的回合`,
      `${BL} ${b.fbConv.toFixed(1)}% · ${pp(d)}`);
  }

  if(tradePct != null && b.tradePct != null){
    const d = tradePct - b.tradePct;
    push(d*1.5, '被补率',
      `首杀被补掉 ${tradePct.toFixed(1)}%`,
      `${BL} ${b.tradePct.toFixed(1)}% · ${pp(d)}`);
  }

  if(defWin != null && baseDef != null){
    const d = defWin - baseDef;
    push(Math.abs(d)*1.5, '防守端',
      `防守方胜率 ${defWin.toFixed(1)}%`,
      `${BL} ${baseDef.toFixed(1)}% · ${pp(d)}`);
  }

  if(atkWin != null && b.atkWin != null){
    const d = atkWin - b.atkWin;
    push(Math.abs(d)*1.4, '进攻端',
      `进攻方胜率 ${atkWin.toFixed(1)}%`,
      `${BL} ${b.atkWin.toFixed(1)}% · ${pp(d)}`);
  }

  // 开火点集中度：跟「队内平分」和「同范围的中位数」两个参照比
  if(conc && conc.tot >= 40){
    const teamAvg = 100 / Math.max(1, conc.players);
    push(Math.abs(conc.share - teamAvg)*0.9, '开火点',
      `${S.players[conc.pid].n} 拿了 ${conc.top} 次首杀`,
      `占队内 ${conc.share.toFixed(0)}% · ${conc.players} 人平分 ${teamAvg.toFixed(0)}%`
        + (b.concMed != null ? ` · 同范围中位 ${b.concMed.toFixed(0)}%` : ''),
      'player:' + conc.pid);
  }

  if(fullWin != null && b.econWin[2] != null){
    const d = fullWin - b.econWin[2];
    push(Math.abs(d)*1.2, '全买局',
      `全买局胜率 ${fullWin.toFixed(1)}%`,
      `${BL} ${b.econWin[2].toFixed(1)}% · ${pp(d)}`);
  }

  if(ecoWin != null && b.econWin[0] != null){
    const d = ecoWin - b.econWin[0];
    push(Math.abs(d)*1.1, 'eco 局',
      `eco 局胜率 ${ecoWin.toFixed(1)}%`,
      `${BL} ${b.econWin[0].toFixed(1)}% · ${pp(d)}`);
  }

  if(secMed != null && b.secMed != null){
    const d = secMed - b.secMed;
    push(Math.abs(d)*1.2, '开局时机',
      `首杀中位时刻 ${secMed.toFixed(0)} 秒`,
      `${BL} ${b.secMed.toFixed(0)} 秒 · ${d>=0?'+':''}${d.toFixed(0)} 秒`, 'time');
  }

  if(fbRate != null){
    const d = fbRate - 50;
    push(Math.abs(d)*1.2, '首杀率',
      `首杀率 ${fbRate.toFixed(1)}%`,
      `对峙基准 50% · ${pp(d)}`);
  }

  if(ps && ps.n >= 8){
    const pw = 100*ps.won/ps.n, d = pw - 50;
    push(Math.abs(d)*0.55, '手枪局',
      `手枪局 ${ps.won}/${ps.n}（${pw.toFixed(0)}%）`,
      `对峙基准 50% · ${pp(d)}`);
  }

  // 「输掉手枪局后第 2 局的买法」已删除：分档用长枪数，而手枪局后几乎没有长枪，
  // 「硬起 / 强起」恒为 0；而且强起意愿跟当前比分强相关（不想放赛点），
  // 单看买法分不出来是风格还是被迫。

  /* 阵容不在这里报。
     阵容是按地图选的：PRX 最常用的 5 套里有 4 套只出现在单一地图上。
     在「全部地图」下说「默认阵容占 11%」是把不同地图的阵容混在一起算，
     那个数字没有意义。阵容完整地放在下面的「阵容 · 按赛事」时间轴里，
     按赛事（或地图）分开看。 */

  // 类别固定顺序：先首杀本身，再攻防，再经济，最后对峙基准。
  // 同类内按偏离幅度降序。
  const CAT_ORDER = {
    '首杀率': 1, '首杀转化': 2, '被补率': 3, '开火点': 4,
    '防守端': 5, '进攻端': 6, '开局时机': 7,
    '全买局': 8, 'eco 局': 9, '手枪局': 10,
  };
  out.sort((x,y) => {
    const cx = CAT_ORDER[x.tag] ?? 99, cy = CAT_ORDER[y.tag] ?? 99;
    if(cx !== cy) return cx - cy;
    return y.sev - x.sev;
  });

  // 不再截断：所有候选一律列出，按偏离幅度排序，读者自己看差距
  return {picked: out, candidates: out};
}

function renderHead(a, t){
  const name = S.D.teams[t];
  const meta = (S.TM && S.TM[t]) || null;
  document.getElementById('teamName').innerHTML =
    esc(name) + (meta && meta.tag ? `<span class="ttag">${esc(meta.tag)}</span>` : '');
  const lg = document.getElementById('teamLogo');
  if(meta && meta.logo){
    lg.src = meta.logo; lg.hidden = false;
    lg.classList.toggle('plt', !!meta.plate);
    lg.classList.toggle('pltl', !!meta.plateLight);
  }
  else { lg.hidden = true; }
  const evs = new Set(view.map(r => S.D.events[r[0]]));
  const maps = new Set(view.map(r => S.D.maps[r[1]]));
  document.getElementById('teamMeta').textContent =
    `${fmt(a.n)} 回合 · ${maps.size} 张图 · ${evs.size} 个赛事`;

  const badges = [];
  const geoN = view.filter(r => r[9] >= 0).length;
  const econN = view.filter(r => r[16] >= 0).length;
  const geoPct = a.n ? 100*geoN/a.n : 0;
  const econPct = a.n ? 100*econN/a.n : 0;
  if(geoPct < 1) badges.push(['无坐标数据', 'warn']);
  else if(geoPct < 95) badges.push([`坐标覆盖 ${geoPct.toFixed(0)}%`, 'warn']);

  else if(econPct < 95) badges.push([`经济覆盖 ${econPct.toFixed(0)}%`, 'warn']);
  if(a.n < 60) badges.push([`样本偏小（${a.n} 回合）`, 'warn']);
  document.getElementById('teamBadges').innerHTML =
    badges.map(([txt, cls]) => `<span class="badge ${cls}">${esc(txt)}</span>`).join('');
}

function renderVerdict(a, b, t, ps){
  const all = insights(a, b, t, ps);
  const list = all.picked;
  const box = document.getElementById('verdictBody');
  const title = document.getElementById('verdictTitle');
  // 标题写明对比范围和口径，读者一眼知道这些数和谁比
  const bl = b.scopeLabel || '全部赛事 · 全部地图';
  if(title) title.textContent = `对比 ${bl} 的回合加权平均`;
  if(!list.length){
    box.innerHTML = '<div class="vnone">这个范围里没有可比的指标。</div>';
    return;
  }
  // 全部候选直接列出，不再折叠——折叠里放的和上面是同一批，等于打印两遍
  box.innerHTML = list.map(o => `
    <div class="vitem">
      <span class="vtag">${esc(o.tag)}</span>
      <span class="vbody"><span class="vmain">${o.main}</span><span class="vcmp">${o.cmp}</span></span>
    </div>`).join('');
}

function renderKpis(a, b, t){
  // [标签, 值, 基准值, 样本量, 基准说明]
  const items = [
    // 回合胜率、首杀率是「零和」指标：每回合必然一方赢、一方拿到首杀，
    // 所以同范围加权平均恒为 50%，跟谁比都是 50%。
    ['回合胜率', a.n ? 100*a.won/a.n : null, 50, a.n, '对峙 50%'],
    ['首杀率', a.n ? 100*a.fbFor/a.n : null, 50, a.n, '对峙 50%'],
    ['首杀→胜', a.fbFor ? 100*a.fbWon/a.fbFor : null, b.fbConv, a.fbFor, '加权'],
    ['首杀被补率', (a.traded+a.untraded) ? 100*a.traded/(a.traded+a.untraded) : null,
      b.tradePct, a.traded+a.untraded, '加权'],
    // 集中度用「队内平分」当参照：n 个人平均分，每人 100/n
    ['首杀集中度', (b.conc.get(t) && b.conc.get(t).tot >= 40) ? b.conc.get(t).share : null, 20,
      (b.conc.get(t)||{}).tot, '平分 20%'],
    ['Meta Fit', a.metaN ? 100*a.metaHit/a.metaN : null, null, a.metaN, null]
  ];
  document.getElementById('kpis').innerHTML = items.map(([lab, v, base, n, bl]) => {
    let cmp = '';
    if(v != null && base != null){
      const d = v - base;
      const cls = d >= 0 ? 'up' : 'dn';
      cmp += `vs ${bl||'基准'} <span class="${cls}">${d>=0?'+':''}${d.toFixed(1)}pp</span>`;
    }
    if(n != null) cmp += `${cmp?' · ':''}n=${fmt(n)}`;
    const small = (n != null && n < 40) ? ' <span style="color:var(--amber)">小样本</span>' : '';
    const tip = TERMS[lab] ? `<span class="termtip">${esc(TERMS[lab])}</span>` : '';
    return `<div class="kpi"><b class="${v==null?'dim2':''}">${v==null?'—':v.toFixed(1)+'%'}</b>
      <i>${termBtn(lab)}${tip}</i><div class="cmp">${cmp}${small}</div></div>`;
  }).join('');
}

/* 术语卡片：指标名后面的小问号，点开就地显示解释，不另开版面 */
const TERMS = {
  '首杀被补率': '本队拿到首杀的回合里，那个首杀者被对方队友在 5 秒内反杀的比例。'
    + '越高说明打完首杀容易被换掉。基准是当前筛选范围的回合加权平均。',
  '首杀集中度': '本队拿到的首杀里，队内拿得最多的那个人占了多大比例。'
    + '它不等于首杀率——首杀率是「这队抢到多少首杀」，集中度是「抢到的首杀由谁拿」。'
    + '5 个人平分的话每人 20%，换过人的队伍人数更多，平分就更低。',
  'Meta Fit': '阵容里有多少个属于该图的版本英雄（每图全球选取率前 7）。'
    + '衡量这支队伍跟不跟版本，不衡量强弱。',
  '首杀率': '本队拿到首杀的回合占它总回合的比例。反映打法激进还是保守，不反映强弱。'
    + '基准取 50%——每个回合总有一方拿到首杀，两支队伍的平均必然是 50%。',
  '首杀→胜': '拿到首杀的回合里，最后赢下来的比例。'
    + '对比对象是当前筛选范围（同一赛事 / 同一地图）的回合加权平均：'
    + '把该范围所有回合放一起算一个率，不是先算每队的率再平均。'
    + '全部赛事 + 全部地图时是 71%。',
};

function termBtn(lab){
  if(!TERMS[lab]) return esc(lab);

}

function agentName(i){ return S.Z.agents[S.D.agents[i]] || S.D.agents[i]; }

/* 阵容时间轴：行 = 赛事（锁定单个赛事时改为地图），条 = 该行里各阵容的份额 */
const COMP_COLORS = ['#DE3B49','#0E7C74','#A5741C','#4C6A8E','#157F3B','#6D5A8A'];
const COMP_OTHER  = '#C6C0B3';

function compName(cid){ return S.raw.comps[cid].map(agentName).join(' · '); }

function evShort(i){ return S.Z.events[S.D.events[i]] || S.D.events[i]; }

function renderComps(a, rows, t){
  /* 阵容永远按地图看。
     原因：阵容就是按地图选的——PRX 最常用的 5 套里 4 套只出现在单一地图上。
     把不同地图的阵容混在一起算「默认阵容占比」，那个数字没有意义。

     维度规则：
       锁定一张图          → 只有一行，直接列
       锁定赛事、未锁图    → 按地图拆（这才是能比的东西）
       都没锁              → 按地图拆，全季合计
     赛事维度仍然保留在右侧的胜率列里，只是不再拿它当阵容的分组。 */
  const dim = 'map';
  const keyOf = r => r[1];
  const groups = new Map();
  for(const r of rows){
    const k = keyOf(r);
    let g = groups.get(k);
    if(!g){ g = {n:0, won:0, comps:new Map(), compN:0}; groups.set(k, g); }
    g.n++; if(r[4] === t) g.won++;
    const mc = myCompOf(r, t);
    if(mc >= 0){ g.comps.set(mc, (g.comps.get(mc)||0)+1); g.compN++; }
  }
  const keys = [...groups.keys()].sort((x,y) => groups.get(y).n - groups.get(x).n);

  const NTOP = COMP_COLORS.length;
  const top = [...a.comps.entries()].sort((x,y)=>y[1]-x[1]).slice(0, NTOP);
  const colorOf = new Map(top.map(([cid], i) => [cid, COMP_COLORS[i]]));

  document.getElementById('compTitle').textContent = '阵容 · 按地图';
  document.getElementById('compNote').innerHTML = a.compN
    ? `每行一张图，按该队在这张图上的回合数排序。色块宽度 = 这套阵容在这张图上的份额，灰 = 没进前 6 的其余阵容。悬停看阵容与占比。`
      + `阵容本来就是按地图选的，跨地图合并没有意义。`
    : '这个范围没有阵容数据（中国赛区不提供）';

  const otherN = a.compN - top.reduce((s, x) => s + x[1], 0);
  document.getElementById('compLegend').innerHTML = top.map(([cid, n]) => `
    <div class="ci">
      <span class="csw" style="background:${colorOf.get(cid)}"></span>
      <span class="cname">${esc(compName(cid))}</span>
      <span class="cnum">${pct(n, a.compN)}% · ${n} 回合</span>
    </div>`).join('') + (otherN > 0 ? `
    <div class="ci">
      <span class="csw" style="background:${COMP_OTHER}"></span>
      <span class="cname" style="color:var(--dim)">其他 ${a.comps.size - top.length} 套</span>
      <span class="cnum">${pct(otherN, a.compN)}%</span>
    </div>` : '');

  document.getElementById('compList').innerHTML = keys.map(k => {
    const g = groups.get(k);
    const label = S.Z.maps[S.D.maps[k]] || S.D.maps[k];
    const wr = g.n ? 100*g.won/g.n : null;
    const thin = g.n < 20;

    let bar;
    if(!g.compN){
      bar = `<div class="tlbar nodata" title="这张图没有阵容数据（中国赛区不提供）"></div>`;
    }else{
      const segs = [];
      let otherN = 0, otherC = 0;
      for(const [cid, n] of [...g.comps.entries()].sort((x,y)=>y[1]-x[1])){
        if(colorOf.has(cid)) segs.push([colorOf.get(cid), n, compName(cid)]);
        else { otherN += n; otherC++; }
      }
      if(otherN) segs.push([COMP_OTHER, otherN, `其他 ${otherC} 套`]);
      bar = `<div class="tlbar">` + segs.map(([c, n, nm]) =>
        `<i style="width:${100*n/g.compN}%;background:${c}" title="${esc(nm)} · ${pct(n,g.compN)}%"></i>`
      ).join('') + `</div>`;
    }
    return `<div class="tlrow">
      <div class="k" title="${esc(label)}">${esc(label)}</div>
      ${bar}
      <div class="v${thin?' mute':''}"><b>${wr==null?'—':wr.toFixed(1)+'%'}</b> · ${fmt(g.n)}</div>
    </div>`;
  }).join('') || '<div class="small">无数据</div>';
}

function renderPistol(a, b, rows, t){
  const st = pistolStats(rows, t);
  const note = document.getElementById('pistolNote');
  note.textContent = st.n
    ? `${st.n} 个手枪局（每张图 2 个）· 进攻方拿手枪的基准 50.0%`
    : '这个范围没有手枪局数据';

  const cell = (lab, v, sub, warn) => `<div class="kpi">
    <b class="${v==null?'dim2':''}">${v==null?'—':v.toFixed(1)+'%'}</b><i>${lab}</i>
    ${sub?`<div class="cmp">${sub}${warn?' <span style="color:var(--amber)">小样本</span>':''}</div>`:''}</div>`;
  document.getElementById('pistolKpis').innerHTML = [
    cell('手枪局胜率', st.n ? 100*st.won/st.n : null, `${st.won}/${st.n}`),
    cell('进攻手枪', st.atkN ? 100*st.atkWon/st.atkN : null, `${st.atkWon}/${st.atkN}`, st.atkN < 5),
    cell('防守手枪', st.defN ? 100*st.defWon/st.defN : null, `${st.defWon}/${st.defN}`, st.defN < 5)
  ].join('');
}

function renderSides(a){
  // 颜色沿用全站那套：进攻 = 红、防守 = 青，不再用 Valorant 品牌色 #ff4655 / #22d3ee
  const rows = [
    ['进攻', a.atk, 'var(--red)'],
    ['防守', a.def, 'var(--cyan)']
  ];
  document.getElementById('sideRows').innerHTML = rows.map(([lab, s, color]) => `
    <tr>
      <td><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${color};margin-right:6px"></span>${lab}</td>
      <td>${s.n}${s.n<30?'<span style="color:var(--amber)">*</span>':''}</td>
      <td>${s.n?pct(s.won,s.n)+'%':'—'}</td>
      <td>${s.n?pct(s.fbFor,s.n)+'%':'—'}</td>
      <td>${s.fbFor?pct(s.fbWon,s.fbFor)+'%':'—'}</td>
    </tr>`).join('');
}

function renderPlayers(a){
  const list = [...a.players.entries()].sort((x,y)=>y[1].n-x[1].n);
  const tot = list.reduce((s,[,p])=>s+p.n, 0);
  document.getElementById('playerRows').innerHTML = list.map(([pid, p]) => {
    const pl = S.players[pid];
    const ags = [...p.agents.entries()].sort((x,y)=>y[1]-x[1]).slice(0,2)
      .map(([ag])=>agentName(ag)).join(' / ');
    return `<tr>
      <td>${esc(pl.n)}</td>
      <td>${p.n}</td>
      <td>${pct(p.n,tot)}%</td>
      <td>${a.n?(10*p.n/a.n).toFixed(1):'—'}</td>
      <td class="small">${ags}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" class="small">这个范围没有首杀记录</td></tr>';
}

function renderTime(a){
  const secs = a.secs;
  document.getElementById('timeNote').textContent = secs.length
    ? `中位 ${median(secs).toFixed(0)} 秒 · ${fmt(secs.length)} 次有记录`
    : '没有时刻数据';
  const edges = [0,10,20,30,45,999];
  const labels = ['0–10s','11–20s','21–30s','31–45s','46s+'];
  const bins = labels.map(()=>0);
  for(const s of secs){
    for(let i=0;i<edges.length-1;i++) if(s>=edges[i] && s<edges[i+1]){ bins[i]++; break; }
  }
  const mx = Math.max(...bins, 1);
  document.getElementById('timeHist').innerHTML = labels.map((l,i)=>
    `<div class="hbar"><div class="t">${secs.length?Math.round(100*bins[i]/secs.length):0}%</div>
     <div class="b" style="height:${Math.max(2, 60*bins[i]/mx)}px"></div></div>`
  ).join('');
  document.getElementById('timeHistX').innerHTML = labels.map(l=>`<div>${l}</div>`).join('');
}

function renderTrade(a, b){
  const tw = a.traded ? 100*a.tradedWon/a.traded : null;
  const uw = a.untraded ? 100*a.untradedWon/a.untraded : null;
  const gap = (tw!=null && uw!=null) ? uw-tw : null;
  const box = document.getElementById('tradeBlock');
  if(gap == null){ box.innerHTML = '<div class="small">样本不足</div>'; return; }
  const delta = (b.tradeGap != null) ? gap - b.tradeGap : null;
  const small = (a.traded < 25 || a.untraded < 25)
    ? '<div class="legend" style="color:var(--amber)">样本偏小，差值仅供参考</div>' : '';
  const bl = b.scopeLabel || '全部赛事 · 全部地图';
  box.innerHTML = `
    <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="kpi"><b>${tw.toFixed(1)}%</b><i>首杀被补后</i><div class="cmp">n=${a.traded}</div></div>
      <div class="kpi"><b>${uw.toFixed(1)}%</b><i>首杀没被补</i><div class="cmp">n=${a.untraded}</div></div>
      <div class="kpi"><b>${gap.toFixed(1)}</b><i>差值 pp</i>
        <div class="cmp">${delta==null?'—':`vs ${b.tradeGap.toFixed(1)} · <span class="${delta>=0?'up':'dn'}">${delta>=0?'+':''}${delta.toFixed(1)}</span>`}</div></div>
    </div>
    <div class="legend">
      <span>${bl}：被补 ${b.tradedWin!=null?b.tradedWin.toFixed(1):'—'}% vs 没被补 ${b.untradedWin!=null?b.untradedWin.toFixed(1):'—'}%，差 ${b.tradeGap!=null?b.tradeGap.toFixed(1):'—'}pp</span>
    </div>${small}`;
}

/* ---------------------------------------------------------------- */
/* wiring                                                           */
/* ---------------------------------------------------------------- */
function fillSelects(){
  const ts = document.getElementById('teamSel');
  // 次级队默认不进下拉框：它们只在第二赛段出现、回合数太少，没人会拿来分析，
  // 留着只会把下拉框拉得很长，找队都找不到。
  const skip = new Set(S.raw.feeder || []);
  const ranked = S.D.teams.map((name, i) => ({
    name, i,
    n: S.raw.rounds.reduce((s,r)=> s + ((r[2]===i||r[3]===i)?1:0), 0)
  })).filter(o => !skip.has(o.name)).sort((a,b)=> b.n - a.n);
  ts.innerHTML = ranked.map(o => `<option value="${o.i}">${esc(o.name)}</option>`).join('');
}

/* 分面计数：统计某个维度时，把它自己的筛选排除掉。
   这样「选了地图 → 赛事选项的回合数跟着变」而不是全变 0。 */
function facetCounts(except){
  const ev = new Map(), map = new Map(), agent = new Map();
  for(const r of S.raw.rounds){
    if(except !== 'ev'    && F.ev    >= 0 && r[0] !== F.ev) continue;
    if(except !== 'map'   && F.map   >= 0 && r[1] !== F.map) continue;
    if(except !== 'agent' && F.agent >= 0 && r[6] !== F.agent) continue;
    if(except !== 'team'  && F.team  >= 0 && r[2] !== F.team && r[3] !== F.team) continue;
    ev.set(r[0], (ev.get(r[0])||0)+1);
    map.set(r[1], (map.get(r[1])||0)+1);
    agent.set(r[6], (agent.get(r[6])||0)+1);
  }
  return {ev, map, agent};
}

/* 重建「赛事 / 地图」两个下拉。
   回合数是联动的：选了地图，赛事那边的数就是这个地图里的回合数；反之亦然。 */
function fillScopeSelects(){
  if(F.team < 0) return;

  // 先按「队伍 + 地图 + 英雄」算赛事；当前赛事如果被筛成 0 就回落
  const evC = facetCounts('ev').ev;
  if(F.ev >= 0 && !evC.get(F.ev)) F.ev = -1;

  // 再按「队伍 + 赛事 + 英雄」算地图
  const mapC = facetCounts('map').map;
  if(F.map >= 0 && !mapC.get(F.map)) F.map = -1;

  const evIdx = [...evC.keys()].filter(i => evC.get(i) > 0).sort((a,b) => a - b);
  const es = document.getElementById('evSel');
  es.innerHTML = `<option value="-1">全部赛事（${evIdx.length} 个）</option>` +
    evIdx.map(i => {
      const name = S.Z.events[S.D.events[i]] || S.D.events[i];
      return `<option value="${i}">${esc(name)} · ${evC.get(i)} 回合</option>`;
    }).join('');
  es.value = String(F.ev);

  const mapIdx = [...mapC.keys()].filter(i => mapC.get(i) > 0)
    .sort((a,b) => S.D.maps[a].localeCompare(S.D.maps[b]));
  const ms = document.getElementById('mapSel');
  ms.innerHTML = `<option value="-1">全部地图（${mapIdx.length} 张）</option>` +
    mapIdx.map(i => {
      const name = S.Z.maps[S.D.maps[i]] || S.D.maps[i];
      return `<option value="${i}">${esc(name)} · ${mapC.get(i)} 回合</option>`;
    }).join('');
  ms.value = String(F.map);
}

/* 筛选条件写进地址栏：报告可以直接发给教练 */
function syncURL(){
  const q = new URLSearchParams();
  q.set('team', S.D.teams[F.team]);
  if(F.map >= 0) q.set('map', S.D.maps[F.map]);
  if(F.ev  >= 0) q.set('ev',  S.D.events[F.ev]);
  history.replaceState(null, '', '?' + q.toString());
}

function applyURL(){
  const q = new URLSearchParams(location.search);
  const put = (key, list, sel, setter) => {
    const v = q.get(key);
    if(!v) return;
    const i = list.indexOf(v);
    if(i >= 0){ setter(i); document.getElementById(sel).value = String(i); }
  };
  put('team', S.D.teams,  'teamSel', i => F.team = i);
  put('map',  S.D.maps,   'mapSel',  i => F.map  = i);
  put('ev',   S.D.events, 'evSel',   i => F.ev   = i);
  return q.toString().length > 0;
}

function toast(msg){
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    el.setAttribute('role', 'status');
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1900);
}

function recompute(){
  const t = F.team;
  view = S.raw.rounds.filter(r => {
    if(r[2] !== t && r[3] !== t) return false;
    if(F.map >= 0 && r[1] !== F.map) return false;
    if(F.ev >= 0 && r[0] !== F.ev) return false;
    return true;
  });
  const a = aggregate(view, t);

  // 基准只在 赛事/地图 变化时重算（换队伍不影响基准，因为基准不含队伍筛选）
  const key = `${F.ev}|${F.map}`;
  if(S.baseKey !== key){
    S.base = buildBaselines(F.ev, F.map);
    S.baseKey = key;
  }
  const b = S.base;
  const ps = pistolStats(view, t);

  document.getElementById('scopeInfo').innerHTML =
    `当前范围 <b>${fmt(a.n)}</b> 回合<br>${F.map<0?'全部地图':esc(S.Z.maps[S.D.maps[F.map]])}`;

  renderHead(a, t);
  renderVerdict(a, b, t, ps);
  renderKpis(a, b, t);
  renderComps(a, view, t);
  renderPistol(a, b, view, t);  renderSides(a);
  renderPlayers(a);
  renderTime(a);
  renderTrade(a, b);
  syncURL();
}

async function boot(){
  const raw = await (await fetch('data/site_v5.json')).json();
  S.raw = raw; S.D = raw.dict; S.Z = raw.zh; S.M = raw.meta;
  S.players = raw.players; S.TM = raw.teamMeta || null;
  S.base = buildBaselines(-1, -1);
  S.baseKey = '-1|-1';

  document.getElementById('footNote').innerHTML =
    `${raw.meta.rounds.toLocaleString('en-US')} 回合 / ${raw.meta.maps_played} 张地图 / `
    + `${raw.meta.teams_shown} 支队伍 · 首杀 ${raw.meta.first_bloods.toLocaleString('en-US')} 次`
    + ` · 中国赛区无 2D 回放，因此没有坐标与经济数据`;

  fillSelects();
  document.getElementById('teamSel').addEventListener('change', e => {
    F.team = +e.target.value;
    fillScopeSelects();     // 换队伍 → 赛事/地图的候选集跟着换
    recompute();
  });
  document.getElementById('mapSel').addEventListener('change', e => {
    F.map = +e.target.value;
    fillScopeSelects();     // 赛事那边的回合数要跟着这张图变
    recompute();
  });
  document.getElementById('evSel').addEventListener('change', e => {
    F.ev = +e.target.value;
    fillScopeSelects();     // 地图那边要跟着这个赛事收缩
    recompute();
  });

  F.team = +document.getElementById('teamSel').value;
  const fromURL = applyURL();
  fillScopeSelects();          // 用最终选中的队伍来决定赛事/地图候选
  document.getElementById('shareBtn').onclick = async () => {
    try{
      await navigator.clipboard.writeText(location.href);
      toast('链接已复制，可以直接发给教练');
    }catch(e){
      toast('浏览器不允许自动复制，请从地址栏复制');
    }
  };
  recompute();
  if(fromURL) toast('已按链接恢复筛选');
}

boot();
</script>
