<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="duel.title">选手对比 · 无畏契约 2026 首杀</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="i18n.js"></script>
<style>
  :root{
    --bg:#EAE7E0; --panel:#FFFFFF; --panel2:#F5F2EC; --line:#DBD5C9; --line2:#C9C2B4;
    --fg:#1B1A17; --dim:#6B6862; --dim2:#8B8780; --red:#DE3B49; --cyan:#0E7C74; --gold:#A5741C;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg); line-height:1.55;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  }
  /* 页头与另外两页完全一致：白底、同样的内距、页签贴在底边上 */
  header{
    padding:24px 28px 20px; border-bottom:1px solid var(--line);
    background:#FFFFFF;
    display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end;
    justify-content:space-between;
  }
  h1{margin:0; font-size:19px; font-weight:600; letter-spacing:-.01em;
     line-height:1.2; color:var(--fg)}
  h1 span{color:var(--red); font-weight:400; margin:0 1px}
  .sub{font-size:12px; color:var(--dim2); margin-top:6px}
  .tabs{display:flex; gap:2px; align-items:flex-end}
  .tab{
    display:inline-block; padding:7px 14px 8px; font-size:13px;
    color:var(--dim); text-decoration:none; border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .tab:hover{color:var(--fg)}
  /* 选中态用墨黑不用红：红只留给数据 */
  .tab.on{color:var(--fg); border-bottom-color:var(--fg); font-weight:600}

  main{padding:18px 28px 50px; max-width:1760px; margin:0 auto}

  .bar{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:13px 16px; margin-bottom:16px;
    display:flex; flex-wrap:wrap; gap:14px; align-items:center;
  }
  .bar label{font-size:10px; letter-spacing:.1em; color:var(--dim); text-transform:uppercase}
  select{
    background:var(--panel2); border:1px solid var(--line); color:var(--fg);
    padding:7px 12px; border-radius:6px; font-size:13px; min-width:200px;
    font-family:inherit; cursor:pointer; outline:none;
  }
  select:hover{border-color:var(--red)}
  .hint{margin-left:auto; font-size:12px; color:var(--dim)}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px 18px}
  .charthead{display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap}
  .charthead h2{margin:0; font-size:13px; font-weight:600}

  .duelwrap{position:relative; width:100%; overflow:hidden}
  #duelCanvas{display:block; max-width:100%}

  /* 图表下方的明细表：把点背后的数字列出来 */
  .tblwrap{overflow-x:auto; margin-top:14px}
  table{width:100%; border-collapse:collapse; font-size:12px;
        font-variant-numeric:tabular-nums}
  thead th{
    text-align:right; font-weight:500; font-size:10px; letter-spacing:.04em;
    color:var(--dim); padding:0 10px 7px; white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  thead th:first-child, thead th:nth-child(2){text-align:left}
  tbody td{padding:5px 10px; text-align:right; border-bottom:1px solid #EFEBE2;
           font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;
           white-space:nowrap}
  tbody td:first-child, tbody td:nth-child(2){
    text-align:left; font-family:inherit; white-space:nowrap;
  }
  tbody td:first-child{color:var(--fg)}
  tbody td:nth-child(2){color:var(--dim2); font-size:11px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--panel2)}
  /* 尝试次数是这张表的主角，加粗一点 */
  tbody td.n b{font-weight:600; color:var(--fg)}
  tbody td.dim{color:var(--dim2)}

  .note{margin-top:10px; font-size:12px; color:var(--dim2); line-height:1.6}

  /* 页脚与另外两页一致 */
  footer{padding:18px 28px; border-top:1px solid var(--line); color:var(--dim2);
         font-size:10px; background:#FFFFFF}

  /* 语言切换：两个字母，选中态用墨黑，和页签同一套语言 */
  .langsw{display:inline-flex; gap:0; border:1px solid var(--line); border-radius:4px;
          overflow:hidden; background:var(--panel2)}
  .langsw .lb{
    background:none; border:0; font:inherit; font-size:11px; line-height:1;
    padding:5px 9px; color:var(--dim2); cursor:pointer; letter-spacing:.02em;
  }
  .langsw .lb:hover{color:var(--fg)}
  .langsw .lb.on{background:var(--fg); color:#fff; font-weight:600}

  @media (max-width:760px){
    header{padding:18px 16px 14px}
    main{padding:14px 16px 40px}
    .bar{padding:11px 12px; gap:10px}
    select{min-width:0; width:100%}
    .hint{margin-left:0; width:100%}
    /* 7 列在 430px 上放不下，让表自己横向滚，别把整页顶出去 */
    thead th, tbody td{padding-left:7px; padding-right:7px}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1><span data-i18n="duel.h1">选手对比</span> <span>/</span> <span data-i18n="site">无畏契约 2026</span></h1>
    <div class="sub" id="sub" data-i18n="duel.sub">首杀尝试</div>
  </div>
  <nav class="tabs" role="tablist">
    <a class="tab" href="index.html" role="tab" aria-selected="false" data-i18n="nav.overview">总览</a>
    <a class="tab" href="scout.html" role="tab" aria-selected="false" data-i18n="nav.scout">队伍简报</a>
    <a class="tab on" href="duel.html" role="tab" aria-selected="true" data-i18n="nav.duel">选手对比</a>
  </nav>
  <div id="langSlot"></div>
</header>

<main>
  <div class="bar">
    <label data-i18n="ctl.event">赛事</label>
    <select id="evSel"></select>
    <span class="hint" id="scope"></span>
  </div>

  <div class="panel">
    <div class="charthead">
      <h2 data-i18n="duel.chart">首杀尝试</h2>
    </div>
    <div class="duelwrap">
      <canvas id="duelCanvas" width="1200" height="760"></canvas>
    </div>
    <div class="note" id="caption"></div>

    <!-- 尝试次数放在表里，不再靠点的大小猜 -->
    <div class="tblwrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="duel.th.player">选手</th>
            <th data-i18n="duel.th.team">队伍</th>
            <th data-i18n="duel.th.tries">尝试</th>
            <th data-i18n="duel.th.fb">首杀</th>
            <th data-i18n="duel.th.rate">成功率</th>
            <th data-i18n="duel.th.per100">每百回合</th>
            <th data-i18n="duel.th.share">队内占比</th>
          </tr>
        </thead>
        <tbody id="duelRows"></tbody>
      </table>
    </div>
  </div>
</main>

<footer id="foot"></footer>

<script>
/* ================================================================== */
/* 首杀尝试散点图                                                      */
/*                                                                    */
/* X = 每 100 回合参与的首杀尝试次数（越多越常冲在开局第一线）          */
/* Y = 这些尝试里赢下来的比例                                          */
/*                                                                    */
/* 一次首杀尝试必定一对一，输的那方也计一次尝试，所以：                 */
/*   尝试 = 拿到的首杀 + 被别人首杀                                    */
/* 这样两个轴都能从击杀流直接量出来，不需要猜测。                       */
/* ================================================================== */
const MIN_TRIES = 20;      // 至少参与过这么多次首杀尝试
const MIN_SHARE = 25;      // 且队内首杀占比至少这么高

/* 颜色不编码角色。
   试过按「首杀最多的英雄」判角色，结果 24 人里有 24 人被标成决斗——
   因为决斗位天然冲在开局第一线，拿首杀最多的英雄当然也是决斗英雄。
   这个标签测的是「这队的战术安排」，不是选手属性，会误导人。
   所以统一用一个颜色，读者看位置和名字就够了。 */
const DOT_COLOR = '#DE3B49';

let S = { raw: null, D: null, Z: null, M: null, agents: {} };
let state = { ev: 0 };

const $ = id => document.getElementById(id);

/* ---------------- 数据 ---------------- */
/* 每名选手在某个赛事里的首杀尝试记录。
   teamOf 用的是「他拿首杀时的队伍」，因为首杀受害者那边可能拿不到队名。 */
function build(evIdx){
  const per = new Map();          // pid -> {win, lose, team, agents}
  const teamRounds = new Map();
  const teamFb = new Map();

  for(const r of S.raw.rounds){
    if(r[0] !== evIdx) continue;
    for(const t of [r[2], r[3]]){
      if(t >= 0) teamRounds.set(t, (teamRounds.get(t) || 0) + 1);
    }
    const k = r[15], v = r[16];
    if(k < 0) continue;
    const kt = r[5];

    let a = per.get(k);
    if(!a){ a = {win: 0, lose: 0, team: -1}; per.set(k, a); }
    a.win++;
    if(kt >= 0){
      a.team = kt;
      teamFb.set(kt, (teamFb.get(kt) || 0) + 1);
    }

    if(v >= 0 && v !== k){
      let b = per.get(v);
      if(!b){ b = {win: 0, lose: 0, team: -1}; per.set(v, b); }
      b.lose++;
    }
  }

  const out = [];
  for(const [pid, s] of per){
    const n = s.win + s.lose;
    if(n < MIN_TRIES || s.team < 0) continue;
    const tf = teamFb.get(s.team) || 0;
    if(!tf) continue;
    const share = 100 * s.win / tf;
    if(share < MIN_SHARE) continue;
    const rounds = teamRounds.get(s.team) || 0;

    out.push({
      pid,
      name: (S.players[pid] || {}).n || '?',
      team: s.team,
      n, win: s.win,
      rate: 100 * s.win / n,
      share,
      per100: rounds ? 100 * n / rounds : 0,
      rounds,
    });
  }
  return out;
}

/* ---------------- 绘图 ---------------- */
let chartPts = [];

const mean = a => a.length ? a.reduce((s,v) => s + v, 0) / a.length : 0;

/* 点只表示位置，不编码任何数据。
   早先点半径 = 尝试次数，但半径只能比大小、不能读数，
   而且大小和位置互相干扰（大点会盖住邻居），所以样本量挪到下面表里。 */
const DOT_R = 4.5;

function draw(){
  const cv = $('duelCanvas');
  const holder = cv.parentElement;
  const cw = Math.max(300, Math.floor(holder.clientWidth || 1200));
  // 窄屏把画布拉高：430px 宽时按 0.62 只有 266px 高，24 个标签没地方放
  const narrow = cw < 560;
  const ch = Math.round(Math.min(cw * (narrow ? 1.0 : 0.62), 760));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.floor(cw * dpr);
  cv.height = Math.floor(ch * dpr);
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';

  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);

  const rawEv = S.D.events[state.ev];
  const evName = pick(S.Z.events[rawEv] || rawEv, rawEv);

  let pts = build(state.ev);

  $('scope').textContent = t('duel.scope', { ev: evName, n: pts.length });

  if(pts.length < 2){
    ctx.fillStyle = '#8B8780';
    ctx.font = '13px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(t('duel.empty'), cw/2, ch/2);
    $('caption').textContent = '';
    renderRows([]);
    chartPts = [];
    return;
  }
  chartPts = pts;

  const L = 72, Rm = 30, T = 24, B = 62;
  const pw = cw - L - Rm, ph = ch - T - B;

  const xs = pts.map(p => p.per100), ys = pts.map(p => p.rate);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const dx = (x1 - x0) || 1, dy = (y1 - y0) || 1;
  x0 -= dx * 0.12; x1 += dx * 0.12;
  y0 -= dy * 0.12; y1 += dy * 0.12;
  // 保证 y1 > y0（早期版本先 max 再 min，数据集中在一端时会翻转轴，图全空）
  if(y1 - y0 < 8){ const m = (y0 + y1) / 2; y0 = m - 4; y1 = m + 4; }
  if(!(y1 > y0)){ y0 = 0; y1 = 100; }
  if(!(x1 > x0)){ const m = (x0 + x1) / 2; x0 = m - 1; x1 = m + 1; }

  const px = v => L + (v - x0) / (x1 - x0) * pw;
  const py = v => T + ph - (v - y0) / (y1 - y0) * ph;

  // 网格
  ctx.strokeStyle = '#E8E3D8'; ctx.lineWidth = 1;
  ctx.font = '11px system-ui'; ctx.fillStyle = '#8B8780';
  for(let i = 0; i <= 4; i++){
    const v = x0 + (x1 - x0) * i / 4, x = px(v);
    ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + ph); ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillText(v.toFixed(1), x, T + ph + 18);
  }
  for(let i = 0; i <= 4; i++){
    const v = y0 + (y1 - y0) * i / 4, y = py(v);
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L + pw, y); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillText(v.toFixed(0) + '%', L - 9, y + 4);
  }

  /* 虚线 = 这一屏所有选手的均值（不是中位数）。
     两条都标上数字，否则读者不知道那条线是什么。
     用均值而不是中位：选手数量少（15-24 人），中位数会变成一个
     「谁都不在那个位置」的数；均值就是场均选手的位置，也更好解释。 */
  const mx = mean(xs), my = mean(ys);
  ctx.strokeStyle = '#C4BCAC'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(px(mx), T); ctx.lineTo(px(mx), T + ph); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L, py(my)); ctx.lineTo(L + pw, py(my)); ctx.stroke();
  ctx.setLineDash([]);

  // 均值的标注：两条虚线都在图里，文字统一放到左上角。
  // 早先把「均值 50.2%」直接标在横线右端，窄屏时正好压住 ZmjJJK 那几个点，
  // 白底也救不回来（点比标签宽）。左上角是这十几张图里唯一稳定的空白区。
  const mLabel = t('duel.mean', { x: mx.toFixed(1), y: my.toFixed(1) });
  ctx.font = '10px system-ui'; ctx.textAlign = 'left';
  ctx.fillStyle = '#8B8780';
  ctx.fillText(mLabel, L, T - 9);

  // 轴线
  ctx.strokeStyle = '#9A9387'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(L, T); ctx.lineTo(L, T + ph); ctx.lineTo(L + pw, T + ph);
  ctx.stroke();

  // 点：统一大小，只表示位置。样本量在下面的表里，不靠点猜。
  for(const p of pts){
    ctx.beginPath(); ctx.arc(px(p.per100), py(p.rate), DOT_R, 0, Math.PI * 2);
    ctx.fillStyle = DOT_COLOR;
    ctx.globalAlpha = 0.82; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.2; ctx.stroke();
  }

  // 标签：按尝试次数降序，做碰撞避让。放不下的直接不画——
  // 名字叠在一起比不标更糟，点的位置本身已经说明了坐标，表里也有完整名单。
  const maxLabels = narrow ? pts.length : Math.min(pts.length, 32);
  const labelled = [...pts].sort((a, b) => b.n - a.n).slice(0, maxLabels);
  ctx.font = '11px system-ui';
  const placed = [];
  const hits = (bx, by, bw, bh) => placed.some(q =>
    bx < q.x + q.w && bx + bw > q.x && by < q.y + q.h && by + bh > q.y);
  for(const p of labelled){
    const r = DOT_R;
    const cx = px(p.per100), cy = py(p.rate);
    const tw = ctx.measureText(p.name).width;
    const cands = [
      [cx + r + 3, cy + 4],
      [cx - r - 3 - tw, cy + 4],
      [cx - tw/2, cy - r - 6],
      [cx - tw/2, cy + r + 14],
    ];
    let put = null;
    for(const c of cands){
      if(!hits(c[0], c[1] - 10, tw, 13)){ put = c; break; }
    }
    if(!put) continue;                   // 四个方向都被占，就不标
    ctx.textAlign = 'left'; ctx.fillStyle = '#3A3733';
    ctx.fillText(p.name, put[0], put[1]);
    placed.push({x: put[0], y: put[1] - 10, w: tw, h: 13});
  }

  // 轴标题
  ctx.fillStyle = '#4A463F'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(t('duel.axis.x'), L + pw/2, ch - 18);
  ctx.save(); ctx.translate(18, T + ph/2); ctx.rotate(-Math.PI/2);
  ctx.fillText(t('duel.axis.y'), 0, 0); ctx.restore();

  renderRows(pts);

  $('caption').textContent = t('duel.caption', {
    share: MIN_SHARE, tries: MIN_TRIES, n: pts.length,
    x: mx.toFixed(1), y: my.toFixed(1),
  });
}

/* 明细表：按尝试次数降序。
   点的大小只能比「谁大谁小」，读不出具体次数，所以把原始数字列出来。 */
function renderRows(pts){
  const tb = $('duelRows');
  if(!pts || !pts.length){
    tb.innerHTML = `<tr><td colspan="7" class="dim">${esc(t('duel.empty'))}</td></tr>`;
    return;
  }
  const sorted = [...pts].sort((a, b) => b.n - a.n);
  const f1 = v => v.toFixed(1);
  tb.innerHTML = sorted.map(p => `<tr>
      <td>${esc(p.name)}</td>
      <td>${esc(S.D.teams[p.team] || '')}</td>
      <td class="n"><b>${p.n}</b></td>
      <td>${p.win}</td>
      <td>${f1(p.rate)}%</td>
      <td class="dim">${f1(p.per100)}</td>
      <td class="dim">${f1(p.share)}%</td>
    </tr>`).join('');
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

/* ---------------- 交互 ---------------- */
function fillEvents(){
  const sel = $('evSel');
  sel.innerHTML = S.D.events.map((e, i) =>
    `<option value="${i}">${esc(pick(S.Z.events[e] || e, e))}</option>`).join('');
  sel.value = String(state.ev);
  sel.onchange = () => { state.ev = +sel.value; draw(); };
}

let resizeTimer = null;
window.addEventListener('resize', () => {
  if(resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(draw, 160);
});

/* 切语言时重画：图里的文字是 canvas 画的，不会跟着 CSS 变；
   #sub / #foot 是 boot 时写死的，也得一起重写。 */
window.addEventListener('langchange', () => { renderChrome(); fillEvents(); draw(); });

function renderChrome(){
  if(!S.D) return;
  const nEv = S.D.events.length;
  const nRd = S.M.rounds.toLocaleString('en-US');
  $('sub').textContent = t('duel.sub2', { n: nEv, r: nRd });
  $('foot').textContent = t('duel.foot', { n: nEv, r: nRd, m: S.M.maps_played });
}

/* ---------------- boot ---------------- */
async function boot(){
  const j = await (await fetch('data/site_v3.json')).json();
  S.raw = j; S.D = j.dict; S.Z = j.zh; S.M = j.meta;
  S.players = j.players || [];

  // 默认落到最后一个赛事（上海冠军赛）
  const ci = S.D.events.indexOf('Champions Shanghai 2026');
  state.ev = ci >= 0 ? ci : 0;

  renderChrome();
  fillEvents();
  draw();
}

boot();
</script>
</body>
</html>
